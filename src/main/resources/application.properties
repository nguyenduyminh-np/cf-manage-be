
spring.application.name=cf-manager

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3360/cf_crm_nckh_v02?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Jackson timezone configuration for Instant serialization
spring.jackson.time-zone=UTC

# ========================= JWT Security =========================
security.jwt.issuer=cf-manager
security.jwt.access-token-ttl-minutes=30
security.jwt.refresh-token-ttl-days=7
security.jwt.private-key=classpath:keys/private_key.pem
security.jwt.public-key=classpath:keys/public_key.pem

# ========================= Redis Configuration =========================
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.database=0
# spring.data.redis.password= 
spring.data.redis.timeout=60000

# ========================= Booking Scheduler =========================
booking.scheduler.enabled=true
booking.scheduler.cron=0 * * * * *
booking.scheduler.lock-at-most=PT50S
booking.scheduler.lock-at-least=PT2S

# ========================= Token Scheduler =========================
token.scheduler.enabled=true
token.scheduler.cron=0 */5 * * * *
token.scheduler.lock-at-most=PT50S
token.scheduler.lock-at-least=PT2S

# ========================= Spring AI / Gemini =========================
spring.ai.google.genai.api-key=${GEMINI_API_KEY:AIzaSyCzmfkuusCmghO-7CeCqRgChmej-he6fdE}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.chat.options.max-output-tokens=600

# ========================= AI Chat Settings =========================
chat.ai.enabled=true
chat.ai.quota-backoff-ms=300000
chat.cache.table-availability-ttl-seconds=30
chat.history.max-messages=10

